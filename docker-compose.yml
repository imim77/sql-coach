services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sqlcoach
      POSTGRES_PASSWORD: sqlcoach
      POSTGRES_DB: sqlcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlcoach -d sqlcoach"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
