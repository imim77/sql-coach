name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sqlcoach
          POSTGRES_PASSWORD: sqlcoach
          POSTGRES_DB: sqlcoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlcoach -d sqlcoach"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://sqlcoach:sqlcoach@localhost:5432/sqlcoach
      STUDENT_DATABASE_URL: postgresql://student:student@localhost:5432/sqlcoach
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Load schema and seed
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "postgresql://sqlcoach:sqlcoach@localhost:5432/sqlcoach" -v ON_ERROR_STOP=1 -f db/init/01_schema.sql
          psql "postgresql://sqlcoach:sqlcoach@localhost:5432/sqlcoach" -v ON_ERROR_STOP=1 -f db/init/02_seed.sql

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install API dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest

  frontend:
    name: Page build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install page dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
